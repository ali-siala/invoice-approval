[project]
name = "invoice-approval"
description = "Multi-turn tool-use agent environment: German accounts payable (Kreditorenrechnungsprüfung) under a written approval policy, graded by exact database state."
tags = ["tool-use", "multi-turn", "enterprise", "finance", "accounting", "german", "eval", "train"]
version = "0.1.1"
license = "Apache-2.0"
license-files = ["licenses/LICENSE"]
authors = [{ name = "Ali Siala" }]
requires-python = ">=3.11"
dependencies = [
    "verifiers==0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["invoice_approval.py", "pyproject.toml", "ap/", "tasks/"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
